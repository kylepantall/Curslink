name: Android

# Builds the Android app (android/) and runs its core's tests, including
# pairing with and taking input from the real Python host. The release
# calls this and attaches the APK.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  pull_request:
    paths:
      - android/**
      - curslink/pairing/**
      - curslink/net/**
      - curslink/protocol.py
      - curslink/security.py
      - .github/workflows/android.yml
  push:
    branches: [main]
    paths:
      - android/**
      - .github/workflows/android.yml
  workflow_dispatch:

concurrency:
  group: android-${{ github.event.pull_request.number || inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || 'v0.0.0' }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The interop test runs the Python host's own pairing and server.
      - run: python -m pip install -e .
      - uses: gradle/actions/setup-gradle@v4
      - run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      # A stable signing key, so each release installs over the last. Without
      # the secret the APK is signed with this runner's throwaway debug key.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/curslink.jks"
            echo "CURSLINK_ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/curslink.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is debug-signed and won't update an earlier install."
          fi
      - name: Test and build
        working-directory: android
        env:
          CURSLINK_VERSION: ${{ env.VERSION }}
          CURSLINK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CURSLINK_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CURSLINK_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :core:test :app:assembleRelease
      - run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/curslink-$VERSION-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: app-android
          path: dist/*.apk
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: android/*/build/reports
