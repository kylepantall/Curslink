name: Screenshots

# Pictures of the desktop app in Qt's native styles (Windows 11, macOS), so a
# restyle can be checked without each machine to hand. Kept as artifacts and,
# for branches in this repo, on a "screenshots/<branch>" branch.

on:
  pull_request:
    paths: ["curslink/gui/**", "packaging/screenshots.py", ".github/workflows/screenshots.yml"]
  workflow_dispatch:

jobs:
  draw:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[gui]"
      - run: python packaging/screenshots.py screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: screenshots/

  publish:
    needs: draw
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: shots
          merge-multiple: true
      - name: Push to screenshots/<branch>
        env:
          BRANCH: screenshots/${{ github.head_ref || github.ref_name }}
          TOKEN: ${{ github.token }}
        run: |
          cd shots
          git init -q -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
