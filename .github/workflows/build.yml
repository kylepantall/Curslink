name: App builds

# Builds the packaged Curslink app for Windows, macOS and Linux: one folder
# per platform holding the curslink executable and everything it loads
# (MediaPipe, OpenCV, Tk, Qt for the app), so nobody needs Python installed, plus an
# installer per platform (Windows setup .exe, macOS .pkg, Linux .deb) that
# `curslink update` uses to install newer releases. The release calls this
# and attaches everything; a PR that touches the packaging builds on its
# own, so a broken build shows up before release day.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  pull_request:
    paths:
      - packaging/**
      - pyproject.toml
      - curslink/update.py
      - curslink/cli.py
      - curslink/gui/**
      - curslink/assets/**
      - .github/workflows/build.yml
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.number || inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # PR and manual runs build as 0.0.0.
  TAG: ${{ inputs.tag || 'v0.0.0' }}

jobs:
  build:
    # One platform failing doesn't fail the release; the others still go out.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-latest
            platform: macos-arm64
          - os: ubuntu-latest
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      # The gaze extra is what makes Curslink Curslink, and the gui extra is
      # the app people open; the build carries both.
      - run: python -m pip install ".[gaze,gui]" "pyinstaller>=6.11"
      - run: pyinstaller --noconfirm packaging/curslink.spec

      # The packaged app checks it can load MediaPipe, OpenCV, Tk and Qt (with
      # the app's icons), which PyInstaller can miss: a module only imported
      # at runtime builds fine and then fails on the user's machine.
      # MediaPipe and Qt load the system's EGL, GLES and font libraries, which
      # a Linux desktop has and GitHub's runner image doesn't.
      - name: Install MediaPipe's and Qt's system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgles2 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Smoke test the build
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          exe=dist/curslink/curslink
          [ "$RUNNER_OS" = Windows ] && exe="$exe.exe"
          "$exe" --version
          "$exe" _selftest
          "$exe" check -c examples/curslink.toml
          if [ "$RUNNER_OS" = Windows ]; then
            [ -f dist/curslink/curslinkw.exe ] || { echo "::error::no curslinkw.exe (the app without a console)"; exit 1; }
          fi

      - name: Package
        run: |
          name="curslink-$VERSION-${{ matrix.platform }}"
          mkdir -p out
          cp README.md examples/curslink.toml dist/curslink/
          if [ "$RUNNER_OS" = Windows ]; then
            (cd dist && 7z a -tzip "../out/$name.zip" curslink > /dev/null)
          else
            # tar keeps the executable bit and the macOS ad-hoc signature.
            tar -czf "out/$name.tar.gz" -C dist curslink
          fi
          ls -l out

      # Optional: a code signing certificate (MACOS_SIGN_P12, base64, and
      # MACOS_SIGN_PASSWORD secrets; a self-signed one will do) keeps the
      # app's signature the same across releases, so macOS keeps its
      # permissions through updates. Without it the app is signed ad hoc.
      - name: Load the macOS signing certificate
        if: runner.os == 'macOS'
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
        run: |
          [ -n "$MACOS_SIGN_P12" ] || { echo "no MACOS_SIGN_P12 secret: signing ad hoc"; exit 0; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass=$(uuidgen)
          echo "$MACOS_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/sign.p12" -k "$keychain" -P "$MACOS_SIGN_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/sign.p12"
          identity=$(security find-identity -p codesigning "$keychain" | awk 'NR==1 {print $2}')
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build the installer
        run: packaging/make-installer.sh "$VERSION" ${{ matrix.platform }} out

      # Install it the way a user would, then check the installed copy runs
      # and knows how it was installed (which is what the updater goes by).
      - name: Smoke test the installer
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          case "$RUNNER_OS" in
            Windows)
              setup=$(cygpath -w out/curslink-$VERSION-${{ matrix.platform }}-setup.exe)
              powershell -NoProfile -Command "Start-Process -Wait -FilePath '$setup' -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'"
              exe="$(cygpath -u "$LOCALAPPDATA")/Programs/Curslink/curslink.exe"
              powershell -NoProfile -Command "[Environment]::GetEnvironmentVariable('Path','User')" | grep -qi 'Programs\\Curslink' \
                || { echo "::error::the installer didn't add Curslink to PATH"; exit 1; }
              want=windows-setup ;;
            macOS)
              sudo installer -pkg out/curslink-$VERSION-${{ matrix.platform }}.pkg -target /
              exe=/usr/local/bin/curslink
              want=macos-pkg
              [ -x /Applications/Curslink.app/Contents/MacOS/curslink ] || { echo "::error::no Curslink.app"; exit 1; }
              # macOS records permissions against this identity (packaging/curslink.spec).
              codesign --verify --deep --strict /Applications/Curslink.app
              codesign -dv /Applications/Curslink.app 2>&1 | grep -qx 'Identifier=io.github.orimovo.curslink.app' \
                || { echo "::error::Curslink.app isn't signed as io.github.orimovo.curslink.app"; exit 1; } ;;
            Linux)
              sudo dpkg -i out/curslink-$VERSION-${{ matrix.platform }}.deb
              exe=/usr/bin/curslink
              want=deb
              [ -f /usr/share/applications/curslink.desktop ] || { echo "::error::no menu entry"; exit 1; } ;;
          esac
          "$exe" --version
          "$exe" _selftest
          got=$("$exe" _install-kind | tr -d '\r')
          [ "$got" = "$want" ] || { echo "::error::installed copy says it is '$got', not '$want'"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform }}
          path: out/*
          retention-days: 3
