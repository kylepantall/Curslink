[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "curslink"
version = "0.4.30"
description = "Look at a device and your mouse and keyboard follow: gaze and edge based input switching across computers."
readme = "README.md"
license = "LicenseRef-Curslink"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "pynput>=1.7",
    "zeroconf>=0.132",
    "tomlkit>=0.13",
]

[project.optional-dependencies]
gaze = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.8",
    "numpy>=1.26",
]
# The desktop app (`curslink gui`): window, tray / menu bar icon.
gui = [
    "PySide6-Essentials>=6.8",
    # The QR code a phone scans to pair (pure Python).
    "segno>=1.6",
    # macOS: the window's glass (vibrancy), hiding the Dock icon, camera names.
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation>=10; sys_platform == 'darwin'",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "numpy>=1.26",
]

[project.scripts]
curslink = "curslink.cli:main"

[tool.setuptools.packages.find]
include = ["curslink*"]

[tool.setuptools.package-data]
"curslink.assets" = ["*.svg", "*.png", "navigation/*.svg", "illustrations/*.svg", "illustrations/*/*.svg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
