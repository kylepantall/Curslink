# Curslink example: a desktop with two monitors, plus a laptop to the right.
#
# Copy this to curslink.toml on the HOST (the computer your keyboard and
# mouse are plugged into / paired with) and on every AGENT.

# Pairing (recommended): run `curslink host` and `curslink agent`, then
# `curslink pair` on either one and type the code it shows into the other.
# Each pair of devices gets its own key; nothing secret goes in this file.
#
# Or, the old way: the same secret on every device (or the CURSLINK_SECRET
# env var). It works alongside pairing for devices you haven't paired.
# secret = "change-me-to-something-long-and-random"

[pairing]
enabled = true               # advertise on the LAN and accept pairing requests
port = 24851
# store = "pairings.json"    # default: your user config folder

[update]
check = true                 # look for a newer release when host/agent start
auto = true                  # and install it (installed builds), then restart
prerelease = false           # include release candidates

[host]
device_id = "desktop"        # which [[devices]] entry is this machine
listen = "0.0.0.0"
port = 24850
effect = "pop"               # pop | blink | none (played where the pointer lands)
edge_switching = true        # push the pointer off a screen edge to switch
edge_indicator = true        # near such an edge, it glows and a label names the device it leads to
gap_tolerance_px = 64        # bridge small gaps between screens in the layout
return_hotkey = "ctrl+alt+home"
gaze_toggle_hotkey = "ctrl+alt+g"
swap_cmd_ctrl = true         # Mac <-> PC: Cmd on the Mac is Ctrl on the PC (and back);
                             # the built-in mapping for pairs without a [keymap] table
clipboard = true             # share what's copied (text, pictures, files) with the agents
clipboard_max_mb = 25        # bigger copies stay on their own computer

lan = true                   # accept agents on the LAN; false = relay only
udp = true                   # send pointer moves by UDP to agents that take them
                             # (same port number as above; falls back to TCP)

# --- Network ---------------------------------------------------------------
# Settings > Network shows how each link is doing (latency, jitter, loss,
# direct or relay, mDNS). With optimise on, Curslink tunes each link as it
# goes: marks its packets low-latency (Wi-Fi's voice queue), sends pointer
# moves twice on a lossy link, sends fewer, steadier updates on a slow one,
# and an agent on the relay goes direct once it sees the host on the LAN.
# The same table works on an agent.
# [network]
# optimise = true

# --- Over the internet ----------------------------------------------------
# Meet through your own `curslink relay` server (same values on the host and
# every agent). Either paste the code from `curslink invite`, which also
# holds the pairing secret:
# [relay]
# code = "curslink1-..."
# or give the relay explicitly and keep `secret` above:
# [relay]
# address = "relay.example.com:24852"
# key = "the key from the relay's relay.toml"

[gaze]
enabled = true               # camera-based switching
camera = 0
calibration = "calibration.json"   # written by `curslink calibrate`
dwell_ms = 250               # how long you must look before it switches
max_distance_deg = 12        # further than this from every screen = looking elsewhere
switch_margin_deg = 3        # hysteresis between neighbouring screens
jump_screens = []            # monitors ("device/screen") where looking puts the
                             # pointer on that very monitor, e.g. ["desktop/left"];
                             # looking at any other monitor only picks its device
preview = false              # show the camera with head angles overlaid
confirm_with_agents = true   # agents running their own camera ([agent.gaze])
                             # must see you facing them before gaze switches there
# Without a calibration this camera only tells whether you face this
# computer, which works alongside agents' cameras. Agents' cameras work
# even with enabled = false here.
# facing_deg = 18
# facing_dwell_ms = 100

# --- Dragging files ------------------------------------------------------
# Drag a file over an edge to another computer (or look at it while you hold
# the file) and let go there: it's sent over the paired, encrypted link and
# saved in that computer's Downloads. See [agent.files] for the other end.
# [files]
# enabled = true

# --- Isolink's floating chats ---------------------------------------------
# Drag one of Isolink's floating chats over an edge (or look at the other
# computer while you hold it) and it opens there, still held, when that
# computer's Isolink is linked to the same account. Isolink asks once whether
# to let Curslink do this; change it in Isolink's Connected apps.
# See [agent.isolink] for the other end.
# [isolink]
# enabled = true

# --- The layout ----------------------------------------------------------
# Place every screen of every device in ONE shared coordinate space, arranged
# like your real desk. x/y/width/height are in pixels in that shared space.
# os_x/os_y are where that monitor sits in its OWN computer's display
# settings (0, 0 for the primary monitor).
#
# Screens may not overlap, unless one really stands in front of another (a
# laptop covering a monitor's corner). Then set allow_overlap and give the
# screen in front a higher `z`; the part of the screen behind it is blocked
# out, and pushing the pointer into it moves it to the screen in front.
# [layout]
# allow_overlap = false
#
# Mirror mode (with allow_overlap): while you use the screen behind, every
# screen in front of it shows the part of it that it covers, live, like
# looking through the laptop. The pointer stays on the screen in use inside
# the covered part and is drawn in the mirror (mirror_pointer = false sends
# it to the screen in front instead, as without mirror mode). Any overlap
# works, between any devices, phones included (Android asks once to share
# its screen). On a Mac, the screen behind needs Screen Recording for
# Curslink. An agent can opt out with [agent] mirror = false.
# mirror = false
# mirror_pointer = true
# mirror_fps = 15
#
# Screens are laid out in their own pixels, which differ in size between
# monitors, so the layout only roughly says what a screen in front covers.
# "Line up overlap…" on the Layout page (a click on each screen: where a
# corner of the other one sits) writes where it really is:
# [[layout.fit]]
# behind = "wks82261/screen2"
# front = "kyles-pc/main"
# x = 1200.0      # its top-left corner, px from the top-left of the screen behind
# y = 1100.0
# scale = 0.5     # px of the screen behind to one of its own
#
# Calibrated edges (Layout > Calibrate edge… writes these): where two screens
# of different devices really join, clicked on the monitors themselves. The
# pointer leaves along a_span and comes out the same fraction along b_span,
# so it lines up across sizes and pixel densities; off the span, that edge
# doesn't cross. Spans are pixels along the edge, from its top (left/right
# edges) or its left (top/bottom edges).
# [[layout.links]]
# a = "desktop/right"
# a_side = "right"
# a_span = [200, 1000]
# b = "laptop/main"
# b_side = "left"
# b_span = [0, 800]

# Your own key mappings, for typing from one system into another:
# "<from>><to>" with mac, windows, linux or android, or "device:<id>" for one
# device (which wins). A table replaces the built-in mapping for its pair; an
# empty one changes no keys. Names are by family: cmd also covers cmd_l and
# cmd_r (cmd is the Windows / Super key on a PC). Settings > Keyboard >
# Change a single key > Customise edits these.
# [keymap]
# "linux>windows" = { caps_lock = "ctrl" }
# "mac>windows" = { cmd = "ctrl", ctrl = "cmd", alt = "alt" }
# "device:laptop" = { cmd = "alt" }

[[devices]]
id = "desktop"
name = "Main PC"

  [[devices.screens]]
  id = "left"
  x = 0
  y = 0
  width = 1920
  height = 1080
  os_x = 0
  os_y = 0

  [[devices.screens]]
  id = "right"
  x = 1920
  y = 0
  width = 2560
  height = 1440
  os_x = 1920
  os_y = 0

[[devices]]
id = "laptop"
name = "Work laptop"

  [[devices.screens]]
  id = "main"
  x = 4480                   # directly to the right of the desktop's right monitor
  y = 300
  width = 1512
  height = 982

# --- On an agent ---------------------------------------------------------
# Only the [agent] and [pairing] tables (and `secret`) are read by `curslink agent`.
[agent]
device_id = "laptop"
name = "Work laptop"
# host = "192.168.1.10"      # optional once paired: the host is found on the LAN
                             # (with a [relay] too, the LAN is tried first)
# host_id = "desktop"        # only if this agent is paired with several hosts
port = 24850
animations = true
clipboard = true             # share what's copied here with the host (and on to the others)
udp = true                   # take pointer moves by UDP when the host is reached
                             # directly (never through a relay)
# This computer's own fixes for keys the host sends, applied after the
# host's [keymap]. Settings > Keyboard > "Fix a key" finds
# and saves them; by family, so ctrl covers ctrl_l and ctrl_r:
# modifier_map = { ctrl = "cmd", caps_lock = "esc" }

# Use this device's own camera for gaze (needs the gaze extra). Handy when
# the agent has its own screen, like a second laptop. With the host's camera
# too, the pointer only moves here when both agree (the host sees your head
# turn away, this camera sees you facing this device); without one, this
# camera alone moves it here and back. No calibration on the host needed.
# Files dragged here from the host.
# [agent.files]
# enabled = true
# folder = ""                # where they're saved; empty = Downloads

# Isolink's floating chats carried here from the host (see [isolink]).
# [agent.isolink]
# enabled = true

# [agent.gaze]
# enabled = true
# camera = 0
# camera_name = ""           # follow this camera if its index changes
# facing_deg = 18            # head within this of "straight on" = facing this device
# center_pitch_deg = 0       # e.g. -10 if the camera sits well above the screen
# center_yaw_deg = 0         # e.g. 15 if the camera is off to one side
# dwell_ms = 100
