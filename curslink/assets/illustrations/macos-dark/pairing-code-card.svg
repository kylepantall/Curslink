<svg xmlns="http://www.w3.org/2000/svg" width="360" height="168" viewBox="0 0 360 168" role="img" aria-labelledby="title description">
<title id="title">Pairing code card</title>
<desc id="description">Example six-digit code 482 719, grouped three plus three. Enter the code on the other computer.</desc>
<rect x="0" y="0" width="360" height="168" rx="12" fill="#0A84FF" fill-opacity=".22" /><path d="M24 26v-3a4 4 0 0 1 8 0v3" fill="none" stroke="#0A84FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="22" y="26" width="12" height="9" rx="2" fill="none" stroke="#0A84FF" stroke-width="1.5" /><text x="43" y="32" font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#0A84FF" letter-spacing="1.15">PAIRING CODE</text><text x="180" y="91" font-family="SF Mono, Menlo, monospace" font-size="38" font-weight="500" text-anchor="middle" fill="#F5F5F7" letter-spacing="5.32">482 719</text><text x="180" y="123" font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#A1A1A6" >Enter this code on your other computer</text><text x="180" y="145" font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#A1A1A6" >Keep this window open while pairing</text>
</svg>
