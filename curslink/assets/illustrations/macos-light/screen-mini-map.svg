<svg xmlns="http://www.w3.org/2000/svg" width="150" height="96" viewBox="0 0 150 96" role="img" aria-labelledby="title description">
<title id="title">Connected screens</title>
<desc id="description">Two displays; the right display is active. The active dot pulses every 2.4 seconds unless reduced motion is requested.</desc>
<style>@keyframes pulse{0%,100%{r:6px;opacity:.14}50%{r:10px;opacity:.06}}.pulse{animation:pulse 2.4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style><rect x="8" y="27" width="62" height="42" rx="5" fill="#000000" fill-opacity=".035" stroke="#8E8E93" stroke-width="2" /><path d="M39 70v8M28 78h22" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="76" y="17" width="66" height="46" rx="7" fill="none" stroke="#007AFF" stroke-width="4" opacity=".18"/><rect x="77" y="18" width="64" height="44" rx="5" fill="#007AFF" fill-opacity=".12" stroke="#007AFF" stroke-width="2" /><path d="M109 63v9M98 72h22" fill="none" stroke="#007AFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="109" cy="40" r="6" fill="#007AFF" class="pulse" opacity=".14"/><circle cx="109" cy="40" r="5" fill="#007AFF" />
</svg>
