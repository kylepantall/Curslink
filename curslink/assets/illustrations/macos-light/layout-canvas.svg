<svg xmlns="http://www.w3.org/2000/svg" width="580" height="300" viewBox="0 0 580 300" role="img" aria-labelledby="title description">
<title id="title">Screen arrangement</title>
<desc id="description">A selected local display shares a green connected edge with a purple remote laptop screen. Dotted grid spacing is 16 pixels.</desc>
