ica Neue, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1D1D1F" >Work laptop</text><text x="380" y="186" font-family="SF Mono, Menlo, monospace" font-size="11" font-weight="400" text-anchor="middle" fill="#6E6E73" >1920 × 1080</text><rect x="288" y="129" width="4" height="68" rx="2" fill="#248A3D" /><path d="M277 162h26m-4-4 4 4-4 4" fill="none" stroke="#248A3D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="27" cy="271" r="3" fill="#248A3D" /><text x="37" y="275" font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#6E6E73" >Linked edge</text><text x="556" y="275" font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, sans-serif" font-size="11" font-weight="400" text-anchor="end" fill="#6E6E73" >Drag screens to match your desk</text>
