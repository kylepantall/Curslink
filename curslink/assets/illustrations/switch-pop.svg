<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" role="img" aria-labelledby="title description">
<title id="title">Switch pop</title>
<desc id="description">One-shot 380 millisecond pop indicator. Reduced motion uses a still ring and dot. Reinsert the image to replay.</desc>
<style>@keyframes pop{0%{r:10px;stroke-width:9px;opacity:1}100%{r:76px;stroke-width:1px;opacity:0}}@keyframes fade{0%{opacity:1}100%{opacity:0}}.ring{animation:pop 380ms cubic-bezier(.215,.61,.355,1) forwards}.dot{animation:fade 380ms cubic-bezier(.215,.61,.355,1) forwards}@media(prefers-reduced-motion:reduce){.ring,.dot{animation:none}}</style><circle class="ring" cx="90" cy="90" r="34" fill="none" stroke="#3FA9FF" stroke-width="3"/><circle class="dot" cx="90" cy="90" r="3.5" fill="#3FA9FF"/>
</svg>
