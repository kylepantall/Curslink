<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" role="img" aria-labelledby="title description">
<title id="title">Switch blink</title>
<desc id="description">One-shot 380 millisecond blink indicator. Reduced motion uses a still ring and dot. Reinsert the image to replay.</desc>
<style>@keyframes blink{0%,39%,60%,89%{opacity:1}40%,59%,90%,100%{opacity:0}}.blink{animation:blink 380ms steps(1,end) forwards}@media(prefers-reduced-motion:reduce){.blink{animation:none}}</style><g class="blink" fill="#3FA9FF"><circle cx="90" cy="90" r="34" fill="none" stroke="#3FA9FF" stroke-width="6"/><circle cx="90" cy="90" r="4.5"/></g>
</svg>
